<!doctype html>
<html lang="ko"{{LOCK_CLASS}}>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>유튜브 학습 노트</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{
    --bg:#fff; --surface:#f9fafb; --surface-2:#f2f4f6;
    --text:#191f28; --text-sub:#4e5968; --text-mute:#8b95a1;
    --line:#e5e8eb; --brand:#3182f6; --brand-soft:#e8f3ff;
    --radius:16px; --maxw:1120px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#17171c; --surface:#1e1e24; --surface-2:#26262e;
      --text:#eaeaef; --text-sub:#b0b8c1; --text-mute:#8b95a1;
      --line:#2e2e38; --brand:#5b9dff; --brand-soft:#1b2a44;
    }
  }
  *{box-sizing:border-box}
  html{scroll-padding-top:120px}
  body{margin:0; background:var(--bg); color:var(--text);
    font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
    font-size:16px; line-height:1.6; letter-spacing:-.01em; -webkit-font-smoothing:antialiased}
  .wrap{max-width:var(--maxw); margin:0 auto; padding:0 16px}
  header{padding:48px 0 20px}
  header h1{margin:0 0 6px; font-size:32px; letter-spacing:-.03em; line-height:1.3}
  header p{margin:0; color:var(--text-sub)}
  .bar{position:sticky; top:0; z-index:5; background:var(--bg); border-bottom:1px solid var(--line); padding:12px 0}
  .controls{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
  .seg{display:inline-flex; background:var(--surface-2); border-radius:12px; padding:3px}
  .seg button{border:0; background:none; color:var(--text-sub); font:inherit; font-size:14px; font-weight:600;
    padding:7px 14px; border-radius:9px; cursor:pointer}
  .seg button[aria-pressed="true"]{background:var(--bg); color:var(--text); box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .order{border:1px solid var(--line); background:var(--bg); color:var(--text); font:inherit; font-size:14px; font-weight:600;
    padding:7px 12px; border-radius:12px; cursor:pointer; white-space:nowrap}
  .order:hover{border-color:var(--brand); color:var(--brand)}
  input[type=search]{flex:1; min-width:180px; font:inherit; font-size:15px; color:var(--text);
    background:var(--surface-2); border:1px solid transparent; border-radius:12px; padding:9px 14px; outline:none}
  input[type=search]:focus{border-color:var(--brand); background:var(--bg)}
  nav.chips{display:flex; gap:6px; overflow-x:auto; padding-top:10px; scrollbar-width:none}
  nav.chips::-webkit-scrollbar{display:none}
  nav.chips a{flex:none; text-decoration:none; color:var(--text-sub); font-size:14px; font-weight:600;
    background:var(--surface); border:1px solid var(--line); padding:5px 12px; border-radius:999px}
  nav.chips a:hover{color:var(--brand); border-color:var(--brand)}
  .n{display:inline-block; margin-left:6px; font-size:.78em; font-weight:600; color:var(--text-mute)}
  section.big{padding-top:36px}
  section.big h2{margin:0 0 4px; font-size:24px; letter-spacing:-.02em}
  section.mid{padding-top:28px}
  section.mid h3{margin:0; padding-bottom:8px; border-bottom:1px solid var(--line); font-size:19px; letter-spacing:-.02em}
  section.sub{padding-top:16px}
  section.sub h4.subh{margin:0 0 10px; font-size:15px; font-weight:700; color:var(--text-sub)}
  section.sub h4.subh::before{content:""; display:inline-block; width:4px; height:4px; margin:0 8px 3px 2px;
    border-radius:50%; background:var(--brand)}
  section.chsec{padding-top:20px}
  section.chsec h3{margin:0 0 12px; font-size:17px; color:var(--text-sub)}
  nav.toc{display:flex; flex-wrap:wrap; gap:4px 14px; margin-top:6px}
  nav.toc a{text-decoration:none; color:var(--text-sub); font-size:14px}
  nav.toc a:hover{color:var(--brand)}
  .chgroup{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:14px; margin-bottom:14px}
  .chhead{font-weight:700; font-size:15px; margin:0 0 10px 2px}
  .chhead::before{content:"채널 "; color:var(--brand); font-weight:700}
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:14px; margin-bottom:14px}
  .chgroup .grid, .tpgroup .grid{margin-bottom:0}
  .tpgroup{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:14px; margin-top:16px}
  .tphead{font-weight:700; font-size:17px; margin:0 0 2px 2px; letter-spacing:-.02em}
  .tpabout{margin:0 0 12px 2px; font-size:14px; color:var(--text-sub)}
  .card{display:flex; flex-direction:column; text-decoration:none; color:inherit; background:var(--bg);
    border:1px solid var(--line); border-radius:14px; overflow:hidden; transition:transform .15s, border-color .15s}
  .card:hover{transform:translateY(-2px); border-color:var(--brand)}
  .thumb{aspect-ratio:16/9; background:var(--surface-2)}
  .thumb img{width:100%; height:100%; object-fit:cover; display:block}
  .body{padding:12px 14px 14px; display:flex; flex-direction:column; gap:4px; flex:1}
  .body h4{margin:0; font-size:16px; line-height:1.4; letter-spacing:-.02em}
  .body p{margin:0; font-size:14px; color:var(--text-sub); line-height:1.5}
  .meta{margin-top:auto; padding-top:6px; font-size:13px; color:var(--text-mute)}
  .meta .ch{color:var(--text-sub); font-weight:600}
  .tag{align-self:flex-start; font-size:12px; font-weight:600; color:var(--brand); background:var(--brand-soft);
    padding:2px 8px; border-radius:6px}
  .empty{display:none; padding:48px 0; text-align:center; color:var(--text-mute)}
  footer{padding:48px 0 64px; color:var(--text-mute); font-size:13px}
  [hidden]{display:none !important}
  @media (max-width:560px){ header{padding-top:32px} header h1{font-size:26px} .grid{grid-template-columns:1fr} }
  /* 비밀번호 화면: 통과 전에는 본문을 그리지 않아요 (보안 장치가 아니라 가림막이에요) */
  #lock{display:none}
  html.locked body > :not(#lock){display:none !important}
  html.locked #lock{display:flex; min-height:100vh; align-items:center; justify-content:center; padding:16px}
  #lock form{width:100%; max-width:320px; display:flex; flex-direction:column; gap:10px}
  #lock h1{margin:0 0 6px; font-size:22px; letter-spacing:-.02em}
  #lock input{font:inherit; font-size:16px; color:var(--text); background:var(--surface-2);
    border:1px solid transparent; border-radius:12px; padding:12px 14px; outline:none}
  #lock input:focus{border-color:var(--brand); background:var(--bg)}
  #lock button{font:inherit; font-size:16px; font-weight:700; color:#fff; background:var(--brand);
    border:0; border-radius:12px; padding:12px; cursor:pointer}
  #lock .err{margin:0; min-height:1.4em; font-size:14px; color:#f04452}
</style>
<script>
  var LOCK_HASH = "{{PW_HASH}}";
  // 문서 페이지에서 넘어왔다면 통과 후 그 문서로 돌려보내요. 이 사이트 안의 주소만 받아요.
  function lockNext(){
    var n = new URLSearchParams(location.search).get('next') || '', base = location.pathname.replace(/[^/]*$/, '');
    return (n.indexOf(base) === 0 && n.indexOf('//') === -1) ? n : '';
  }
  if (LOCK_HASH) {
    var unlocked = false;
    try { unlocked = localStorage.getItem('yn-unlock') === LOCK_HASH; } catch (e) {}
    if (unlocked) {
      document.documentElement.classList.remove('locked');
      if (lockNext()) location.replace(lockNext());
    }
  }
{{GUARD_JS}}
</script>
</head>
<body>
<div id="lock">
  <form id="lock-form" autocomplete="off">
    <h1>유튜브 학습 노트</h1>
    <input type="password" id="lock-pw" placeholder="비밀번호" aria-label="비밀번호" autofocus>
    <button type="submit">들어가기</button>
    <p class="err" id="lock-err" role="alert"></p>
  </form>
</div>
<script>
(function(){
  var form = document.getElementById('lock-form'), pw = document.getElementById('lock-pw'), err = document.getElementById('lock-err');
  function sha256(s){
    return crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)).then(function(buf){
      return Array.prototype.map.call(new Uint8Array(buf), function(b){ return ('0' + b.toString(16)).slice(-2); }).join('');
    });
  }
  form.addEventListener('submit', function(e){
    e.preventDefault();
    sha256(pw.value).then(function(h){
      if (h === LOCK_HASH) {
        try { localStorage.setItem('yn-unlock', h); } catch (e) {}
        if (lockNext()) { location.replace(lockNext()); return; }
        document.documentElement.classList.remove('locked');
      } else {
        err.textContent = '비밀번호가 맞지 않아요.'; pw.select();
      }
    });
  });
})();
</script>
<div class="wrap">
  <header>
    <h1>유튜브 학습 노트</h1>
  </header>
</div>
<div class="bar">
  <div class="wrap">
    <div class="controls">
      <div class="seg" role="group" aria-label="보기 방식">
        <button type="button" data-view="cat" aria-pressed="true">주제별</button>
        <button type="button" data-view="topic" aria-pressed="false">묶음별</button>
        <button type="button" data-view="ch" aria-pressed="false">채널별</button>
        <button type="button" data-view="time" aria-pressed="false">시간별</button>
      </div>
      <button type="button" class="order" id="order" hidden>최신순</button>
      <input type="search" id="q" placeholder="제목, 채널, 주제, 묶음으로 찾기" aria-label="검색">
    </div>
    <nav class="chips" id="chips-cat">{{NAV}}</nav>
    <nav class="chips" id="chips-topic" hidden>{{TOPIC_NAV}}</nav>
  </div>
</div>
<main class="wrap">
  <div id="view-cat">{{CATEGORY_VIEW}}</div>
  <div id="view-topic" hidden>{{TOPIC_VIEW}}</div>
  <div id="view-ch" hidden>{{CHANNEL_VIEW}}</div>
  <div id="view-time" hidden>{{TIME_VIEW}}</div>
  <p class="empty" id="empty">찾는 영상이 없어요. 다른 단어로 찾아보세요.</p>
</main>
<footer class="wrap"></footer>
<script>
(function(){
  var q = document.getElementById('q'), orderBtn = document.getElementById('order'),
      chips = {cat: document.getElementById('chips-cat'), topic: document.getElementById('chips-topic')},
      views = {cat: document.getElementById('view-cat'), topic: document.getElementById('view-topic'),
               ch: document.getElementById('view-ch'), time: document.getElementById('view-time')},
      empty = document.getElementById('empty'), current = 'cat', newestFirst = true;
  function store(k, v){ try { localStorage.setItem(k, v); } catch(e) {} }
  function read(k){ try { return localStorage.getItem(k); } catch(e) { return null; } }
  function setView(v){
    current = v;
    document.querySelectorAll('.seg button').forEach(function(b){ b.setAttribute('aria-pressed', b.dataset.view === v); });
    Object.keys(views).forEach(function(k){ views[k].hidden = k !== v; });
    orderBtn.hidden = v !== 'time';
    store('home-view', v);
    filter();
  }
  // 시간별 보기는 최신순으로 그려 두고, 오래된순이면 날짜 묶음과 그 안의 카드를 뒤집어요.
  function setOrder(newest){
    if (newest !== newestFirst) {
      var root = views.time;
      Array.prototype.slice.call(root.children).reverse().forEach(function(sec){ root.appendChild(sec); });
      root.querySelectorAll('.grid').forEach(function(g){
        Array.prototype.slice.call(g.children).reverse().forEach(function(c){ g.appendChild(c); });
      });
      newestFirst = newest;
    }
    orderBtn.textContent = newest ? '최신순 ↓' : '오래된순 ↑';
    orderBtn.setAttribute('aria-label', newest ? '최신순으로 보는 중, 눌러서 오래된순으로' : '오래된순으로 보는 중, 눌러서 최신순으로');
    store('home-order', newest ? 'new' : 'old');
  }
  function filter(){
    var term = q.value.trim().toLowerCase(), root = views[current], shown = 0;
    root.querySelectorAll('.card').forEach(function(c){
      var ok = !term || c.dataset.q.indexOf(term) !== -1;
      c.hidden = !ok; if (ok) shown++;
    });
    root.querySelectorAll('[data-group]').forEach(function(g){ g.hidden = !g.querySelector('.card:not([hidden])'); });
    Array.prototype.slice.call(root.querySelectorAll('[data-sec]')).reverse().forEach(function(s){
      s.hidden = !s.querySelector('.card:not([hidden])');
    });
    Object.keys(chips).forEach(function(k){ chips[k].hidden = current !== k || !!term; });
    root.querySelectorAll('nav.toc').forEach(function(t){ t.hidden = !!term; });
    empty.style.display = shown ? 'none' : 'block';
  }
  document.querySelectorAll('.seg button').forEach(function(b){ b.addEventListener('click', function(){ setView(b.dataset.view); }); });
  orderBtn.addEventListener('click', function(){ setOrder(!newestFirst); });
  q.addEventListener('input', filter);
  setOrder(read('home-order') !== 'old');
  var saved = read('home-view');
  setView(views[saved] ? saved : 'cat');
})();
</script>
</body>
</html>
