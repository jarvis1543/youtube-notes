<!doctype html>
<html lang="ko"{{LOCK_CLASS}}>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>유튜브 학습 노트</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  /* 시안 true-black-flat: 검정 바탕, 층은 밝기 차이로만, 색(연두)은 데이터에만. 항상 어두운 화면이에요. */
  :root{
    color-scheme:dark;
    --ground:#000; --surface:#111; --raised:#2a2a2a; --border:#1a1a1a; --line:#2e2e2e;
    --text:#fff; --muted:#b4b4b4; --faint:#949494; --hover:#e6e6e6;
    --accent:#c6f24e; --danger:#e5566f;
    --side:220px; --bar:64px; --card:248px;
  }
  *{box-sizing:border-box}
  html,body{overflow-x:clip}
  body{margin:0; background:var(--ground); color:var(--text);
    font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
    font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased}
  a{color:inherit; text-decoration:none}
  button,input{font:inherit; color:inherit}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px}
  [hidden]{display:none !important}

  .app{display:flex; min-height:100vh}
  /* 사이드바: 지금 보기의 맨 윗단계(대분류, 채널, 날짜) */
  .side{flex:none; width:var(--side); position:sticky; top:0; height:100vh; overflow-y:auto; border-right:1px solid var(--border)}
  .brand{height:var(--bar); display:flex; align-items:center; gap:10px; padding:0 20px; border-bottom:1px solid var(--border)}
  .brand svg{flex:none}
  .brand strong{font-size:15px}
  .tree{display:flex; flex-direction:column; padding:16px 12px 32px}
  .tree .head{font-size:12px; color:var(--faint); padding:0 10px 8px}
  .tree ul{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:2px}
  .tree a{display:flex; align-items:center; justify-content:space-between; gap:8px; min-height:34px; padding:6px 10px;
    border-radius:8px; color:var(--muted); line-height:1.35}
  .tree a:hover{color:var(--text)}
  .tree a[aria-current="true"]{color:var(--text); font-weight:600; background:var(--surface)}
  .tree .lbl{min-width:0}
  .tree .n{flex:none; font-size:12px; font-weight:400; color:var(--faint); font-variant-numeric:tabular-nums}
  .sheethead{display:none}

  .col{flex:1; min-width:0; display:flex; flex-direction:column}
  .bar{height:var(--bar); display:flex; align-items:center; gap:16px; padding:0 29px; border-bottom:1px solid var(--border)}
  .mini{display:none}
  .search{flex:1 1 auto; max-width:560px; display:flex; align-items:center; gap:8px; height:36px; padding:0 14px;
    background:var(--surface); border:1px solid var(--line); border-radius:999px}
  .search:focus-within{border-color:var(--muted)}
  .search svg{flex:none; color:var(--muted)}
  .search input{flex:1; min-width:0; border:0; outline:none; background:transparent; font-size:14px}
  .search input::placeholder{color:var(--faint)}
  .search kbd{font:inherit; font-size:12px; color:var(--faint); border:1px solid var(--line); border-radius:4px; padding:0 5px}
  .seg{margin-left:auto; display:flex; align-items:center; gap:4px; height:var(--bar); padding-left:16px; border-left:1px solid var(--border)}
  .seg button{height:36px; padding:0 14px; border:0; border-radius:999px; background:none; color:var(--muted); font-size:14px; cursor:pointer}
  .seg button:hover{color:var(--text)}
  .seg button[aria-pressed="true"]{background:var(--text); color:var(--ground); font-weight:600}

  main{padding:24px 29px 64px; min-width:0}
  .pagehead{display:flex; flex-direction:column; gap:4px; margin-bottom:14px}
  .crumb{display:flex; flex-wrap:wrap; gap:6px; font-size:13px; color:var(--faint)}
  .crumb:empty{display:none}
  .crumb a:hover{color:var(--text)}
  .titlerow{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap}
  .titlerow h1{margin:0; font-size:22px; line-height:1.3; font-weight:700}
  .titlerow h1 .n{font-size:15px; font-weight:400; color:var(--muted); margin-left:8px}
  .titlerow p{margin:2px 0 0; color:var(--muted)}
  .titlerow p b{color:var(--accent); font-weight:600}
  .order{height:36px; padding:0 14px; border:1px solid var(--line); border-radius:999px; background:var(--surface);
    font-size:13px; cursor:pointer; white-space:nowrap}
  .order:hover{border-color:var(--muted)}
  .chips{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:28px}
  .chips a{display:inline-flex; align-items:center; gap:6px; height:36px; padding:0 14px; border-radius:999px;
    background:var(--surface); color:var(--hover); border:1px solid var(--line); white-space:nowrap}
  .chips a:hover{border-color:var(--muted)}
  .chips a span{font-variant-numeric:tabular-nums; opacity:.7}
  .chips a[aria-current="true"]{background:var(--text); color:var(--ground); border-color:var(--text); font-weight:600}

  /* 섹션: 고른 갈래만 남기고, 조상은 제목을 숨겨요(맨 위 h1이 대신해요) */
  section[data-sec]{display:flex; flex-direction:column; gap:12px; min-width:0}
  section[data-sec] + section[data-sec]{margin-top:28px}
  section[data-sec].off{display:none}
  section.anc > :not(section), section.sel > h2, section.sel > h3, section.sel > h4{display:none}
  section.anc{gap:0}
  section.anc > section[data-sec]:first-of-type, section.sel > section[data-sec]:first-of-type{margin-top:0}
  section h2{margin:0; font-size:19px}
  section h3{margin:0; font-size:17px}
  section h4{margin:0; font-size:16px; font-weight:600}
  .n{margin-left:6px; font-size:13px; font-weight:400; color:var(--faint); font-variant-numeric:tabular-nums}
  .tpabout{margin:0; color:var(--muted)}
  /* 영상이 바로 들어 있는 섹션: 제목 줄 오른쪽에 "모두 보기" */
  section.leafsec{display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:baseline; column-gap:16px}
  section.leafsec > :not(h2):not(h3):not(h4):not(.more){grid-column:1 / -1}
  .more{font-size:13px; color:var(--muted); white-space:nowrap}
  .more:hover{color:var(--text)}
  section.sel > .more{display:none}

  /* 선반: 화면 폭에 맞는 한 줄만 보여요(나머지 줄은 높이 0). "모두 보기"·소분류 선택·검색이면 격자로 펼쳐져요.
     폰도 같은 방식이에요. */
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(var(--card),1fr)); grid-auto-rows:0; column-gap:14px; overflow:hidden}
  .grid > .card:first-child{grid-row:1}
  .grid{grid-template-rows:auto}
  .leaf .grid{grid-auto-rows:auto; row-gap:24px; overflow:visible}
  .card{display:flex; flex-direction:column; gap:8px; min-width:0}
  .thumb{aspect-ratio:16/9; border-radius:12px; overflow:hidden; background:var(--surface)}
  .thumb img{width:100%; height:100%; object-fit:cover; display:block}
  .thumb.quad{display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; gap:2px}
  .thumb.quad img{min-height:0}
  .card:hover .thumb img{opacity:.85}
  .body{display:flex; flex-direction:column; gap:4px; min-width:0}
  .body h4{margin:0; font-size:14px; font-weight:600; line-height:1.4; overflow-wrap:anywhere;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
  .card:hover h4{color:var(--hover); text-decoration:underline; text-underline-offset:3px}
  .body p{display:none; margin:0; font-size:13px; color:var(--muted); overflow-wrap:anywhere}
  .leaf .body p{display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
  .meta{font-size:12px; color:var(--faint); font-variant-numeric:tabular-nums}
  .meta span:not(.ch){white-space:nowrap}
  .tag{align-self:flex-start; font-size:12px; color:var(--hover); background:var(--raised); padding:1px 8px; border-radius:999px}

  /* 묶음: 한 묶음 = 한 판(밝기 한 단계 위), 안에 선반 */
  .tpgroup{background:var(--surface); border-radius:20px; padding:20px; display:flex; flex-direction:column; gap:4px; min-width:0}
  .tpgroup + .tpgroup{margin-top:14px}
  .tphead{font-size:17px; font-weight:600}
  .tpgroup .grid{margin-top:12px}
  .tpgroup .thumb{background:var(--raised); border-radius:10px}

  .empty{padding:48px 0; text-align:center; color:var(--muted)}
  .empty button{margin-top:12px; height:36px; padding:0 16px; border:1px solid var(--line); border-radius:999px; background:var(--surface); cursor:pointer}
  .menubtn{display:none}

  /* 폰·태블릿: 사이드바는 메뉴 시트로, 보기 방식은 아래 탭으로 */
  @media (max-width:900px){
    .side{position:fixed; inset:0; z-index:20; width:auto; height:auto; border:0; background:var(--ground); display:none}
    .side.open{display:block}
    .brand{display:none}
    .sheethead{display:flex; align-items:center; justify-content:space-between; height:56px; padding:0 8px 0 16px; border-bottom:1px solid var(--border)}
    .sheethead strong{font-size:16px}
    .tree a{min-height:44px}
    .bar{height:auto; flex-wrap:wrap; gap:10px; padding:10px 8px 10px 16px}
    .mini{display:flex; align-items:center; gap:8px; flex:1}
    .mini strong{font-size:16px}
    .menubtn, .iconbtn{display:grid; place-items:center; width:44px; height:44px; border:0; background:none; color:var(--text); cursor:pointer}
    .search{order:3; flex:1 0 100%; max-width:none; height:40px; margin-right:8px}
    .search kbd{display:none}
    .seg{position:fixed; left:0; right:0; bottom:0; z-index:10; height:64px; margin:0; padding:0 8px; border:0; border-top:1px solid var(--border);
      background:var(--ground); display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:0}
    .seg button{height:64px; border-radius:0; font-size:13px; color:var(--faint)}
    .seg button[aria-pressed="true"]{background:none; color:var(--text)}
    main{padding:16px 16px 96px}
    .titlerow h1{font-size:20px}
    .chips{gap:6px; margin-bottom:20px}
    .chips a{height:34px; padding:0 12px; font-size:13px}
    .leafsec > :is(h2,h3,h4){min-width:0}
    .tpgroup{padding:16px}
  }

  /* 폰: 선반도 한 줄(카드 2장)이고, 나머지는 "모두 보기"로 펼쳐요 */
  @media (max-width:640px){
    :root{--card:150px}
    .grid{column-gap:12px}
    .leaf .grid{row-gap:18px}
    .tpgroup{padding:16px 14px}
  }

  /* 비밀번호 화면: 통과 전에는 본문을 그리지 않아요 (보안 장치가 아니라 가림막이에요) */
  #lock{display:none}
  html.locked body > :not(#lock){display:none !important}
  html.locked #lock{display:flex; min-height:100vh; align-items:center; justify-content:center; padding:16px}
  #lock form{width:100%; max-width:320px; display:flex; flex-direction:column; gap:10px}
  #lock h2{margin:0 0 6px; font-size:22px}
  #lock input{font-size:16px; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px 14px; outline:none}
  #lock input:focus{border-color:var(--muted)}
  #lock button{font-size:16px; font-weight:700; color:var(--ground); background:var(--text); border:0; border-radius:999px; padding:12px; cursor:pointer}
  #lock .err{margin:0; min-height:1.4em; font-size:14px; color:var(--danger)}
</style>
<script>
  var LOCK_HASH = "{{PW_HASH}}";
  // 문서 페이지에서 넘어왔다면 통과 후 그 문서로 돌려보내요. 이 사이트 안의 주소만 받아요.
  function lockNext(){
    var n = new URLSearchParams(location.search).get('next') || '', base = location.pathname.replace(/[^/]*$/, '');
    return (n.indexOf(base) === 0 && n.indexOf('//') === -1) ? n : '';
  }
  if (LOCK_HASH) {
    var unlocked = false;
    try { unlocked = localStorage.getItem('yn-unlock') === LOCK_HASH; } catch (e) {}
    if (unlocked) {
      document.documentElement.classList.remove('locked');
      if (lockNext()) location.replace(lockNext());
    }
  }
{{GUARD_JS}}
</script>
</head>
<body>
<div id="lock">
  <form id="lock-form" autocomplete="off">
    <h2>유튜브 학습 노트</h2>
    <input type="password" id="lock-pw" placeholder="비밀번호" aria-label="비밀번호" autofocus>
    <button type="submit">들어가기</button>
    <p class="err" id="lock-err" role="alert"></p>
  </form>
</div>
<script>
(function(){
  var form = document.getElementById('lock-form'), pw = document.getElementById('lock-pw'), err = document.getElementById('lock-err');
  function sha256(s){
    return crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)).then(function(buf){
      return Array.prototype.map.call(new Uint8Array(buf), function(b){ return ('0' + b.toString(16)).slice(-2); }).join('');
    });
  }
  form.addEventListener('submit', function(e){
    e.preventDefault();
    sha256(pw.value).then(function(h){
      if (h === LOCK_HASH) {
        try { localStorage.setItem('yn-unlock', h); } catch (e) {}
        if (lockNext()) { location.replace(lockNext()); return; }
        document.documentElement.classList.remove('locked');
      } else {
        err.textContent = '비밀번호가 맞지 않아요.'; pw.select();
      }
    });
  });
})();
</script>
<div class="app">
  <aside class="side" id="side">
    <a class="brand" href="./">
      <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><rect x="1" y="1" width="24" height="24" rx="7" fill="#fff"/><path d="M8 7h7l3 3v9H8z" fill="none" stroke="#000" stroke-width="1.6"/><path d="M11.5 11.6v4.8l3.8-2.4z" fill="#000"/></svg>
      <strong>유튜브 학습 노트</strong>
    </a>
    <div class="sheethead"><strong id="sheet-title">대분류</strong>
      <button type="button" class="iconbtn" id="closeside" aria-label="닫기"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <nav class="tree" id="tree" aria-label="분류"></nav>
  </aside>
  <div class="col">
    <header class="bar">
      <a class="mini" href="./">
        <svg width="24" height="24" viewBox="0 0 26 26" aria-hidden="true"><rect x="1" y="1" width="24" height="24" rx="7" fill="#fff"/><path d="M8 7h7l3 3v9H8z" fill="none" stroke="#000" stroke-width="1.6"/><path d="M11.5 11.6v4.8l3.8-2.4z" fill="#000"/></svg>
        <strong>학습 노트</strong>
      </a>
      <button type="button" class="menubtn" id="menubtn" aria-label="대분류 메뉴" aria-expanded="false" aria-controls="side"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <label class="search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="search" id="q" placeholder="영상 {{COUNT}}개에서 찾기" aria-label="검색">
        <kbd>/</kbd>
      </label>
      <nav class="seg" aria-label="보기 방식">
        <button type="button" data-view="cat" aria-pressed="true">주제별</button>
        <button type="button" data-view="topic" aria-pressed="false">묶음별</button>
        <button type="button" data-view="ch" aria-pressed="false">채널별</button>
        <button type="button" data-view="time" aria-pressed="false">시간별</button>
        <button type="button" data-view="guide" aria-pressed="false">합본</button>
      </nav>
    </header>
    <main>
      <div class="pagehead">
        <nav class="crumb" id="crumb" aria-label="현재 위치"></nav>
        <div class="titlerow">
          <div><h1 id="title">유튜브 학습 노트</h1><p id="sub"></p></div>
          <button type="button" class="order" id="order" hidden>최신순</button>
        </div>
      </div>
      <nav class="chips" id="chips" aria-label="중분류"></nav>
      <div id="view-cat">{{CATEGORY_VIEW}}</div>
      <div id="view-topic" hidden>{{TOPIC_VIEW}}</div>
      <div id="view-ch" hidden>{{CHANNEL_VIEW}}</div>
      <div id="view-time" hidden>{{TIME_VIEW}}</div>
      <div id="view-guide" hidden>{{GUIDE_VIEW}}</div>
      <div class="empty" id="empty" hidden>
        <p>찾는 영상이 없어요. 다른 단어로 찾거나 보기 방식을 바꿔 보세요.</p>
        <button type="button" id="clear">검색 지우기</button>
      </div>
    </main>
  </div>
</div>
<script>
(function(){
  var q = document.getElementById('q'), orderBtn = document.getElementById('order'),
      side = document.getElementById('side'), tree = document.getElementById('tree'), menuBtn = document.getElementById('menubtn'),
      sheetTitle = document.getElementById('sheet-title'), crumb = document.getElementById('crumb'),
      title = document.getElementById('title'), sub = document.getElementById('sub'), chips = document.getElementById('chips'),
      views = {cat: document.getElementById('view-cat'), topic: document.getElementById('view-topic'),
               ch: document.getElementById('view-ch'), time: document.getElementById('view-time'),
               guide: document.getElementById('view-guide')},
      empty = document.getElementById('empty'), current = 'cat', sel = null, newestFirst = true;
  // 보기마다: 사이드바 제목, "전체"의 이름, 개수 단위, 처음에 고를 것(첫 대분류 또는 전체)
  var META = {
    cat:   {head: '대분류', all: '모든 영상', unit: '영상', first: true},
    topic: {head: '대분류별 묶음', all: '모든 묶음', unit: '묶음', first: true},
    ch:    {head: '채널', all: '모든 채널', unit: '영상', first: false},
    time:  {head: '정리한 날짜', all: '모든 날짜', unit: '영상', first: false},
    guide: {head: '합본', all: '모든 합본', unit: '합본', first: false}
  };
  // 이번 주 = 이 브라우저 날짜 기준 월요일부터
  var weekStart = (function(){
    var d = new Date(); d.setDate(d.getDate() - (d.getDay() + 6) % 7);
    return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
  })();
  function store(k, v){ try { localStorage.setItem(k, v); } catch(e) {} }
  function read(k){ try { return localStorage.getItem(k); } catch(e) { return null; } }
  function kids(el){ return Array.prototype.filter.call(el.children, function(c){ return c.matches('section[data-sec]'); }); }
  function esc(s){ var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
  function total(v){ return v === 'topic' ? views.topic.querySelectorAll('.tpgroup').length : views[v].querySelectorAll('.card').length; }
  function unitOf(s){ return s.dataset.unit || META[current].unit; }
  function path(s){ var p = []; for (var e = s; e && e !== views[current]; e = e.parentElement) if (e.matches('section[data-sec]')) p.unshift(e); return p; }

  // 영상이 바로 들어 있는 섹션마다 "모두 보기"를 달아요 (선반을 격자로 펼치는 링크)
  Object.keys(views).forEach(function(k){
    views[k].querySelectorAll('section[data-sec]').forEach(function(s){
      if (kids(s).length) return;
      var h = s.querySelector(':scope > h2, :scope > h3, :scope > h4'), a = document.createElement('a');
      a.className = 'more'; a.href = '#' + s.id; a.textContent = '모두 보기 ' + s.querySelectorAll('.card').length + ' ›';
      s.classList.add('leafsec');
      if (h) h.after(a);
    });
  });

  function buildTree(){
    var m = META[current];
    sheetTitle.textContent = m.head;
    tree.innerHTML = '<span class="head">' + m.head + '</span><ul><li><a href="#' + current + '" data-for="">' +
      '<span class="lbl">' + m.all + '</span><span class="n">' + total(current) + '</span></a></li>' +
      kids(views[current]).map(function(s){
        return '<li><a href="#' + s.id + '" data-for="' + s.id + '"><span class="lbl">' + esc(s.dataset.name) + '</span><span class="n">' + s.dataset.n + '</span></a></li>';
      }).join('') + '</ul>';
  }

  // 고른 섹션만 보여 주고, 제목·경로·중분류 칩을 맞춰요
  function render(){
    var root = views[current], m = META[current], p = sel ? path(sel) : [];
    root.querySelectorAll('section[data-sec]').forEach(function(s){
      s.classList.toggle('off', !!sel && !(s === sel || s.contains(sel) || sel.contains(s)));
      s.classList.toggle('anc', !!sel && s !== sel && s.contains(sel));
      s.classList.toggle('sel', s === sel);
    });
    root.classList.toggle('leaf', !!sel && !kids(sel).length);
    tree.querySelectorAll('a').forEach(function(a){ a.setAttribute('aria-current', a.dataset.for === (p[0] ? p[0].id : '')); });
    crumb.innerHTML = p.slice(0, -1).map(function(s){ return '<a href="#' + s.id + '">' + esc(s.dataset.name) + '</a><span aria-hidden="true">›</span>'; }).join('');
    title.innerHTML = esc(sel ? sel.dataset.name : m.all) + '<span class="n">' + (sel ? unitOf(sel) + ' ' + sel.dataset.n : m.unit + ' ' + total(current)) + '개</span>';
    var fresh = Array.prototype.filter.call((sel || root).querySelectorAll('.card'), function(c){ return c.dataset.day >= weekStart; }).length;
    sub.innerHTML = fresh ? '이번 주에 정리한 영상 <b>' + fresh + '개</b>가 여기 있어요.' : '';
    // 중분류 칩: 고른 것의 대분류 아래 갈래들
    var top = p[0], items = (current === 'cat' || current === 'topic') && top ? kids(top) : [];
    chips.hidden = !items.length;
    if (items.length) {
      var on = p[1] || top, chip = function(s, label){ return '<a href="#' + s.id + '" aria-current="' + (s === on) + '">' + esc(label) + ' <span>' + s.dataset.n + '</span></a>'; };
      chips.innerHTML = chip(top, '전체') + items.map(function(s){ return chip(s, s.dataset.name); }).join('');
    }
  }

  function filter(){
    var term = q.value.trim().toLowerCase(), root = views[current], shown = 0;
    if (term) {
      root.querySelectorAll('section[data-sec]').forEach(function(s){ s.classList.remove('off', 'anc', 'sel'); });
      root.classList.add('leaf'); crumb.innerHTML = ''; chips.hidden = true;
    } else render();
    root.querySelectorAll('.card').forEach(function(c){
      var ok = !term || c.dataset.q.indexOf(term) !== -1;
      c.hidden = !ok; if (ok) shown++;
    });
    root.querySelectorAll('[data-group]').forEach(function(g){ g.hidden = !g.querySelector('.card:not([hidden])'); });
    Array.prototype.slice.call(root.querySelectorAll('[data-sec]')).reverse().forEach(function(s){
      s.hidden = !s.querySelector('.card:not([hidden])');
    });
    if (term) { title.innerHTML = '검색 결과<span class="n">영상 ' + shown + '개</span>'; sub.textContent = '‘' + q.value.trim() + '’이(가) 들어간 영상이에요.'; }
    empty.hidden = !!shown;
  }

  // 주소의 #<섹션 id> 또는 #<보기 이름>이 지금 보는 곳이에요. 뒤로 가기와 링크 공유가 그대로 돼요.
  function apply(){
    var h = decodeURIComponent(location.hash.slice(1)), el = h && document.getElementById(h), v = null, s = null;
    if (views[h]) v = h;
    else if (el && el.matches('section[data-sec]')) {
      Object.keys(views).forEach(function(k){ if (views[k].contains(el)) v = k; });
      s = el;
    }
    if (!v) {
      v = views[read('home-view')] ? read('home-view') : 'cat';
      var saved = read('home-sel-' + v), se = saved && document.getElementById(saved);
      s = saved === '' ? null : (se && views[v].contains(se) ? se : (META[v].first ? kids(views[v])[0] : null));
    }
    if (v !== current || !tree.firstChild) {
      current = v;
      document.querySelectorAll('.seg button').forEach(function(b){ b.setAttribute('aria-pressed', b.dataset.view === v); });
      Object.keys(views).forEach(function(k){ views[k].hidden = k !== v; });
      orderBtn.hidden = v !== 'time';
      store('home-view', v);
      buildTree();
    }
    sel = s;
    store('home-sel-' + v, s ? s.id : '');
    filter();
  }
  function go(hash){ if (location.hash === hash) apply(); else location.hash = hash; }
  function openSide(open){ side.classList.toggle('open', open); menuBtn.setAttribute('aria-expanded', open); }

  // 시간별 보기는 최신순으로 그려 두고, 오래된순이면 날짜 묶음과 그 안의 카드를 뒤집어요.
  function setOrder(newest){
    if (newest !== newestFirst) {
      var root = views.time;
      Array.prototype.slice.call(root.children).reverse().forEach(function(sec){ root.appendChild(sec); });
      root.querySelectorAll('.grid').forEach(function(g){
        Array.prototype.slice.call(g.children).reverse().forEach(function(c){ g.appendChild(c); });
      });
      newestFirst = newest;
      if (current === 'time') buildTree(), render();
    }
    orderBtn.textContent = newest ? '최신순 ↓' : '오래된순 ↑';
    orderBtn.setAttribute('aria-label', newest ? '최신순으로 보는 중, 눌러서 오래된순으로' : '오래된순으로 보는 중, 눌러서 최신순으로');
    store('home-order', newest ? 'new' : 'old');
  }

  document.querySelectorAll('.seg button').forEach(function(b){
    b.addEventListener('click', function(){
      var v = b.dataset.view, saved = read('home-sel-' + v), se = saved && document.getElementById(saved);
      go('#' + (se ? saved : (saved === '' || !META[v].first ? v : kids(views[v])[0].id)));
    });
  });
  tree.addEventListener('click', function(e){ if (e.target.closest('a')) openSide(false); });
  menuBtn.addEventListener('click', function(){ openSide(true); });
  document.getElementById('closeside').addEventListener('click', function(){ openSide(false); });
  window.addEventListener('hashchange', function(){ apply(); window.scrollTo(0, 0); });
  orderBtn.addEventListener('click', function(){ setOrder(!newestFirst); });
  q.addEventListener('input', filter);
  document.getElementById('clear').addEventListener('click', function(){ q.value = ''; filter(); q.focus(); });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && side.classList.contains('open')) openSide(false);
    if (e.key === '/' && document.activeElement !== q && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { e.preventDefault(); q.focus(); }
  });
  setOrder(read('home-order') !== 'old');
  apply();
})();
</script>
</body>
</html>
