<!doctype html>
<html lang="ko"{{LOCK_CLASS}}>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>유튜브 학습 노트</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  /* 시안 A (accent-ladder): 파랑은 작은 표시에만, 넓은 면은 옅은 파랑. 그림자·그라데이션 없음. */
  :root{
    --ground:#f7f8fa; --surface:#fff; --raised:#eceff2; --border:#e5e8eb; --rule:#f0f2f4; --control:#d1d6db;
    --text:#191f28; --muted:#4e5968; --faint:#6b7684;
    --accent:#3182f6; --accent-soft:#e8f3ff; --accent-ink:#1b4fa8; --link:#1b64da; --danger:#d22030;
    --side:264px; --maxw:1176px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --ground:#111114; --surface:#1a1a1f; --raised:#26262d; --border:#2c2c34; --rule:#24242b; --control:#3d3d47;
      --text:#eef0f3; --muted:#b0b8c1; --faint:#9aa3ad;
      --accent:#5b9dff; --accent-soft:#1b2a44; --accent-ink:#a9c9ff; --link:#8ab8ff; --danger:#ff6b76;
    }
  }
  *{box-sizing:border-box}
  html,body{overflow-x:clip}
  body{margin:0; background:var(--ground); color:var(--text);
    font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
    font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased}
  a{color:inherit; text-decoration:none}
  button,input,select{font:inherit; color:inherit}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px}
  [hidden]{display:none !important}
  .num{font-variant-numeric:tabular-nums}

  .app{display:flex; min-height:100vh}
  /* 사이드바: 이름, 검색, 보기 방식, 분류 트리 */
  .side{flex:none; width:var(--side); position:sticky; top:0; height:100vh; overflow-y:auto;
    padding:20px 12px 32px; border-right:1px solid var(--border); display:flex; flex-direction:column; gap:16px}
  .brand{display:flex; align-items:center; gap:10px; padding:0 8px}
  .brand svg{flex:none}
  .brand strong{display:block; font-size:15px; line-height:1.3}
  .brand span{font-size:12px; color:var(--muted)}
  .search{display:flex; align-items:center; gap:8px; height:36px; padding:0 10px; margin:0 4px;
    background:var(--surface); border:1px solid var(--control); border-radius:8px}
  .search:focus-within{border-color:var(--accent)}
  .search svg{flex:none; color:var(--faint)}
  .search input{flex:1; min-width:0; border:0; outline:none; background:transparent; font-size:14px}
  .search input::placeholder{color:var(--faint)}
  .search kbd{font:inherit; font-size:12px; color:var(--faint); border:1px solid var(--border); border-radius:4px; padding:0 5px}
  .seg{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:2px; margin:0 4px; padding:3px;
    background:var(--raised); border-radius:8px}
  .seg button{height:30px; border:0; border-radius:6px; background:none; font-size:13px; color:var(--muted); cursor:pointer}
  .seg button:hover{color:var(--text)}
  .seg button[aria-pressed="true"]{background:var(--surface); color:var(--text); font-weight:600}
  .treebtn{display:none}
  .tree{display:flex; flex-direction:column}
  .tree .head{font-size:12px; color:var(--faint); padding:8px 12px 4px}
  .tree ul{list-style:none; margin:0; padding:0}
  .tree li > ul{display:none}
  .tree li.open > ul{display:block}
  .tree a{display:flex; align-items:center; gap:6px; min-height:32px; margin:1px 0; padding:5px 12px 5px calc(8px + var(--d,0) * 16px);
    border-radius:6px; color:var(--muted); line-height:1.35}
  .tree a.top{color:var(--text)}
  .tree a:hover{background:var(--raised)}
  .tree a[aria-current="true"]{background:var(--accent-soft); color:var(--accent-ink); font-weight:600}
  .tree a::before{content:""; flex:none; width:12px; font-size:12px; color:var(--faint)}
  .tree li.kids > a::before{content:"▸"}
  .tree li.kids.open > a::before{content:"▾"}
  .tree a .lbl{flex:1; min-width:0}
  .tree a .n{flex:none; font-size:12px; font-weight:400; color:var(--faint); font-variant-numeric:tabular-nums}

  /* 본문 */
  main{flex:1; min-width:0; max-width:var(--maxw); padding:28px 40px 64px}
  .pagehead{display:flex; flex-direction:column; gap:6px; margin-bottom:20px}
  .crumb{display:flex; flex-wrap:wrap; gap:6px; font-size:13px; color:var(--muted); min-height:20px}
  .crumb a:hover{color:var(--link)}
  .titlerow{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap}
  .titlerow h1{margin:0; font-size:24px; line-height:1.3; font-weight:700; letter-spacing:-.02em}
  .titlerow p{margin:4px 0 0; color:var(--muted)}
  .order{height:32px; padding:0 12px; border:1px solid var(--control); border-radius:6px; background:var(--surface);
    font-size:13px; cursor:pointer; white-space:nowrap}
  .order:hover{border-color:var(--accent)}
  .subs{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px; margin-bottom:28px}
  .subs a{display:flex; flex-direction:column; justify-content:center; gap:2px; min-height:61px; padding:10px 12px;
    background:var(--surface); border:1px solid var(--border); border-radius:8px; min-width:0}
  .subs a:hover{border-color:var(--accent)}
  .subs a span{font-size:13px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .subs a b{font-size:16px; font-weight:600; font-variant-numeric:tabular-nums}
  .subs a[aria-current="true"]{background:var(--accent-soft); border:1.5px solid var(--accent)}
  .subs a[aria-current="true"] span{color:var(--accent-ink)}

  /* 섹션: 고른 분류의 조상은 제목을 숨기고(맨 위 h1이 대신해요), 다른 갈래는 꺼요 */
  section[data-sec]{display:flex; flex-direction:column; gap:12px}
  section[data-sec] + section[data-sec]{margin-top:32px}
  section[data-sec] section[data-sec]:first-of-type{margin-top:8px}
  section.off{display:none}
  section.anc > :not(section), section.sel > h2, section.sel > h3, section.sel > h4{display:none}
  section.anc{gap:0}
  section.anc > section[data-sec]:first-of-type, section.sel > section[data-sec]:first-of-type{margin-top:0}
  section h2{margin:0; font-size:20px; letter-spacing:-.02em}
  section h3{margin:0; font-size:18px; letter-spacing:-.02em}
  section h4{margin:0; font-size:16px}
  section.chsec h3{font-size:16px}
  .n{margin-left:6px; font-size:13px; font-weight:400; color:var(--faint); font-variant-numeric:tabular-nums}
  .tpabout{margin:0; color:var(--muted)}

  /* 영상 목록: 두 줄 행을 두 칸으로 */
  .grid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:0 24px;
    background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:4px 20px}
  .chgroup{background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:14px 20px 4px}
  .chgroup .grid{background:none; border:0; border-radius:0; padding:0}
  .chgroup + .chgroup, .chgroup + .grid, .grid + .chgroup{margin-top:12px}
  .chhead{font-size:13px; font-weight:600; color:var(--muted)}
  .chhead::before{content:"같은 채널 "; font-weight:400; color:var(--faint)}
  .card{display:flex; gap:16px; padding:14px 0; border-bottom:1px solid var(--rule); min-width:0}
  .thumb{flex:none; width:160px; aspect-ratio:16/9; border-radius:6px; overflow:hidden; background:var(--raised)}
  .thumb img{width:100%; height:100%; object-fit:cover; display:block}
  .body{display:flex; flex-direction:column; gap:3px; min-width:0}
  .body h4{margin:0; font-size:15px; font-weight:600; line-height:1.4;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; overflow-wrap:anywhere}
  .card:hover h4{color:var(--link)}
  .body p{margin:0; font-size:13px; color:var(--muted);
    display:-webkit-box; -webkit-line-clamp:1; -webkit-box-orient:vertical; overflow:hidden; overflow-wrap:anywhere}
  .meta{margin-top:auto; font-size:12px; color:var(--faint); font-variant-numeric:tabular-nums}
  .meta span:not(.ch){white-space:nowrap}
  .meta .ch{color:var(--muted)}
  .tag{align-self:flex-start; font-size:12px; font-weight:600; color:var(--accent-ink); background:var(--accent-soft);
    padding:1px 8px; border-radius:4px}

  /* 묶음: 한 묶음 = 한 패널, 안에는 세로 카드 */
  .tpgroup{background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:20px; display:flex; flex-direction:column; gap:4px}
  .tpgroup + .tpgroup{margin-top:16px}
  .tphead{font-size:18px; font-weight:600; line-height:1.4}
  .tpgroup .grid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:16px; background:none; border:0; border-radius:0; padding:0; margin-top:12px}
  .tpgroup .card{flex-direction:column; gap:6px; padding:0; border:0}
  .tpgroup .thumb{width:100%}
  .tpgroup .body h4{font-size:13px}
  .tpgroup .body p{display:none}

  .empty{padding:48px 0; text-align:center; color:var(--muted)}
  .empty button{margin-top:12px; height:36px; padding:0 14px; border:1px solid var(--control); border-radius:6px;
    background:var(--surface); cursor:pointer}

  /* 폰·태블릿: 사이드바는 위로 올라오고, 분류 트리는 버튼으로 열어요 */
  @media (max-width:900px){
    .app{display:block}
    .side{position:static; width:auto; height:auto; overflow:visible; border-right:0; border-bottom:1px solid var(--border);
      padding:12px 16px; gap:10px}
    .brand, .search, .seg{margin:0; padding-left:0; padding-right:0}
    .search{padding:0 10px}
    .seg{padding:3px}
    .seg button{height:38px; font-size:14px}
    .search kbd{display:none}
    .treebtn{display:flex; align-items:center; justify-content:space-between; gap:8px; min-height:44px; padding:0 12px;
      background:var(--surface); border:1px solid var(--control); border-radius:8px; text-align:left; cursor:pointer}
    .treebtn span{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
    .treebtn b{flex:none; font-size:13px; font-weight:400; color:var(--link)}
    .tree{display:none}
    .tree.open{display:flex; max-height:60vh; overflow-y:auto; background:var(--surface); border:1px solid var(--border);
      border-radius:8px; padding:4px}
    .tree a{min-height:44px}
    main{padding:20px 16px 48px}
    .subs{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:20px}
    .subs a{flex-direction:row; align-items:center; gap:6px; min-height:36px; padding:0 12px; border-radius:999px}
    .subs a b{font-size:13px}
  }
  @media (max-width:640px){
    .grid{grid-template-columns:1fr; padding:0 14px}
    .chgroup{padding:12px 14px 0}
    .card{gap:12px; padding:12px 0}
    .thumb{width:120px}
    .body h4{font-size:14px}
    .body p{display:none}
    .tpgroup{padding:16px}
    .tpgroup .grid{grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px 12px}
    .titlerow h1{font-size:22px}
  }

  /* 비밀번호 화면: 통과 전에는 본문을 그리지 않아요 (보안 장치가 아니라 가림막이에요) */
  #lock{display:none}
  html.locked body > :not(#lock){display:none !important}
  html.locked #lock{display:flex; min-height:100vh; align-items:center; justify-content:center; padding:16px}
  #lock form{width:100%; max-width:320px; display:flex; flex-direction:column; gap:10px}
  #lock h2{margin:0 0 6px; font-size:22px; letter-spacing:-.02em}
  #lock input{font-size:16px; background:var(--surface); border:1px solid var(--control); border-radius:8px; padding:12px 14px; outline:none}
  #lock input:focus{border-color:var(--accent)}
  #lock button{font-size:16px; font-weight:700; color:#fff; background:#1b64da; border:0; border-radius:8px; padding:12px; cursor:pointer}
  #lock .err{margin:0; min-height:1.4em; font-size:14px; color:var(--danger)}
</style>
<script>
  var LOCK_HASH = "{{PW_HASH}}";
  // 문서 페이지에서 넘어왔다면 통과 후 그 문서로 돌려보내요. 이 사이트 안의 주소만 받아요.
  function lockNext(){
    var n = new URLSearchParams(location.search).get('next') || '', base = location.pathname.replace(/[^/]*$/, '');
    return (n.indexOf(base) === 0 && n.indexOf('//') === -1) ? n : '';
  }
  if (LOCK_HASH) {
    var unlocked = false;
    try { unlocked = localStorage.getItem('yn-unlock') === LOCK_HASH; } catch (e) {}
    if (unlocked) {
      document.documentElement.classList.remove('locked');
      if (lockNext()) location.replace(lockNext());
    }
  }
{{GUARD_JS}}
</script>
</head>
<body>
<div id="lock">
  <form id="lock-form" autocomplete="off">
    <h2>유튜브 학습 노트</h2>
    <input type="password" id="lock-pw" placeholder="비밀번호" aria-label="비밀번호" autofocus>
    <button type="submit">들어가기</button>
    <p class="err" id="lock-err" role="alert"></p>
  </form>
</div>
<script>
(function(){
  var form = document.getElementById('lock-form'), pw = document.getElementById('lock-pw'), err = document.getElementById('lock-err');
  function sha256(s){
    return crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)).then(function(buf){
      return Array.prototype.map.call(new Uint8Array(buf), function(b){ return ('0' + b.toString(16)).slice(-2); }).join('');
    });
  }
  form.addEventListener('submit', function(e){
    e.preventDefault();
    sha256(pw.value).then(function(h){
      if (h === LOCK_HASH) {
        try { localStorage.setItem('yn-unlock', h); } catch (e) {}
        if (lockNext()) { location.replace(lockNext()); return; }
        document.documentElement.classList.remove('locked');
      } else {
        err.textContent = '비밀번호가 맞지 않아요.'; pw.select();
      }
    });
  });
})();
</script>
<div class="app">
  <aside class="side">
    <a class="brand" href="./">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><rect width="30" height="30" rx="8" fill="#3182f6"/><path d="M9 7h9l4 4v12H9z" fill="#fff"/><path d="M13.5 13.2v6l4.8-3z" fill="#3182f6"/></svg>
      <span><strong>유튜브 학습 노트</strong><span>영상 {{COUNT}}개, 채널 {{CHANNELS}}개</span></span>
    </a>
    <label class="search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input type="search" id="q" placeholder="제목, 채널, 분류, 묶음으로 찾기" aria-label="검색">
      <kbd>/</kbd>
    </label>
    <div class="seg" role="group" aria-label="보기 방식">
      <button type="button" data-view="cat" aria-pressed="true">주제별</button>
      <button type="button" data-view="topic" aria-pressed="false">묶음별</button>
      <button type="button" data-view="ch" aria-pressed="false">채널별</button>
      <button type="button" data-view="time" aria-pressed="false">시간별</button>
    </div>
    <button type="button" class="treebtn" id="treebtn" aria-expanded="false" aria-controls="tree"><span id="treebtn-label"></span><b>바꾸기</b></button>
    <nav class="tree" id="tree" aria-label="분류"></nav>
  </aside>
  <main>
    <div class="pagehead">
      <nav class="crumb" id="crumb" aria-label="현재 위치"></nav>
      <div class="titlerow">
        <div><h1 id="title">유튜브 학습 노트</h1><p id="sub"></p></div>
        <button type="button" class="order" id="order" hidden>최신순</button>
      </div>
    </div>
    <nav class="subs" id="subs" aria-label="하위 분류"></nav>
    <div id="view-cat">{{CATEGORY_VIEW}}</div>
    <div id="view-topic" hidden>{{TOPIC_VIEW}}</div>
    <div id="view-ch" hidden>{{CHANNEL_VIEW}}</div>
    <div id="view-time" hidden>{{TIME_VIEW}}</div>
    <div class="empty" id="empty" hidden>
      <p>찾는 영상이 없어요. 다른 단어로 찾거나 보기 방식을 바꿔 보세요.</p>
      <button type="button" id="clear">검색 지우기</button>
    </div>
  </main>
</div>
<script>
(function(){
  var q = document.getElementById('q'), orderBtn = document.getElementById('order'),
      tree = document.getElementById('tree'), treeBtn = document.getElementById('treebtn'),
      treeLabel = document.getElementById('treebtn-label'), crumb = document.getElementById('crumb'),
      title = document.getElementById('title'), sub = document.getElementById('sub'), subs = document.getElementById('subs'),
      views = {cat: document.getElementById('view-cat'), topic: document.getElementById('view-topic'),
               ch: document.getElementById('view-ch'), time: document.getElementById('view-time')},
      empty = document.getElementById('empty'), current = 'cat', sel = null, newestFirst = true;
  // 보기마다: 트리 제목, "전체"의 이름, 개수 단위, 처음에 고를 것(첫 대분류 또는 전체)
  var META = {
    cat:   {head: '분류', all: '모든 영상', unit: '영상', first: true},
    topic: {head: '분류별 묶음 수', all: '모든 묶음', unit: '묶음', first: true},
    ch:    {head: '채널', all: '모든 채널', unit: '영상', first: false},
    time:  {head: '정리한 날짜', all: '모든 날짜', unit: '영상', first: false}
  };
  function store(k, v){ try { localStorage.setItem(k, v); } catch(e) {} }
  function read(k){ try { return localStorage.getItem(k); } catch(e) { return null; } }
  function kids(el){ return Array.prototype.filter.call(el.children, function(c){ return c.matches('section[data-sec]'); }); }
  function esc(s){ var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
  function total(v){ return v === 'topic' ? views.topic.querySelectorAll('.tpgroup').length : views[v].querySelectorAll('.card').length; }
  function unitOf(s){ return s.dataset.unit || META[current].unit; }
  function path(s){ var p = []; for (var e = s; e && e !== views[current]; e = e.parentElement) if (e.matches('section[data-sec]')) p.unshift(e); return p; }

  // 섹션 구조를 그대로 트리로 그려요
  function buildTree(){
    var m = META[current];
    function li(s, d){
      var ks = kids(s), h = '<li' + (ks.length ? ' class="kids"' : '') + ' data-for="' + s.id + '"><a href="#' + s.id + '" class="' + (d ? '' : 'top') + '" style="--d:' + d + '">' +
        '<span class="lbl">' + esc(s.dataset.name) + '</span><span class="n">' + s.dataset.n + '</span></a>';
      if (ks.length) h += '<ul>' + ks.map(function(k){ return li(k, d + 1); }).join('') + '</ul>';
      return h + '</li>';
    }
    tree.innerHTML = '<span class="head">' + m.head + '</span><ul><li data-for=""><a href="#' + current + '" class="top" style="--d:0">' +
      '<span class="lbl">' + m.all + '</span><span class="n">' + total(current) + '</span></a></li>' +
      kids(views[current]).map(function(s){ return li(s, 0); }).join('') + '</ul>';
  }

  // 고른 섹션만 보여 주고, 제목·경로·하위 분류 칸을 맞춰요
  function render(){
    var root = views[current], m = META[current], p = sel ? path(sel) : [];
    root.querySelectorAll('section[data-sec]').forEach(function(s){
      s.classList.toggle('off', !!sel && !(s === sel || s.contains(sel) || sel.contains(s)));
      s.classList.toggle('anc', !!sel && s !== sel && s.contains(sel));
      s.classList.toggle('sel', s === sel);
    });
    tree.querySelectorAll('li').forEach(function(l){
      var s = l.dataset.for ? document.getElementById(l.dataset.for) : null;
      l.classList.toggle('open', !!s && p.indexOf(s) !== -1);
      l.firstChild.setAttribute('aria-current', (s || null) === sel ? 'true' : 'false');
    });
    crumb.innerHTML = p.slice(0, -1).map(function(s){ return '<a href="#' + s.id + '">' + esc(s.dataset.name) + '</a><span aria-hidden="true">›</span>'; }).join('');
    title.textContent = sel ? sel.dataset.name : m.all;
    sub.textContent = sel ? unitOf(sel) + ' ' + sel.dataset.n + '개' : m.unit + ' ' + total(current) + '개';
    treeLabel.textContent = sel ? p.map(function(s){ return s.dataset.name; }).join(' › ') : m.all;
    // 하위 분류 칸: 고른 분류에 하위가 있으면 그 하위들, 없으면 형제들
    var base = !sel ? null : (kids(sel).length ? sel : (p.length > 1 ? p[p.length - 2] : null));
    var items = base ? kids(base) : [];
    subs.hidden = !items.length || current === 'ch' || current === 'time';
    if (!subs.hidden) {
      var cell = function(s, label){ return '<a href="#' + s.id + '" aria-current="' + (s === sel) + '"><span>' + esc(label) + '</span><b>' + s.dataset.n + '</b></a>'; };
      subs.innerHTML = cell(base, '전체') + items.map(function(s){ return cell(s, s.dataset.name); }).join('');
    }
  }

  function filter(){
    var term = q.value.trim().toLowerCase(), root = views[current], shown = 0;
    if (term) {
      root.querySelectorAll('section[data-sec]').forEach(function(s){ s.classList.remove('off', 'anc', 'sel'); });
      title.textContent = '검색 결과'; crumb.innerHTML = ''; subs.hidden = true;
    } else render();
    root.querySelectorAll('.card').forEach(function(c){
      var ok = !term || c.dataset.q.indexOf(term) !== -1;
      c.hidden = !ok; if (ok) shown++;
    });
    root.querySelectorAll('[data-group]').forEach(function(g){ g.hidden = !g.querySelector('.card:not([hidden])'); });
    Array.prototype.slice.call(root.querySelectorAll('[data-sec]')).reverse().forEach(function(s){
      s.hidden = !s.querySelector('.card:not([hidden])');
    });
    if (term) sub.textContent = '‘' + q.value.trim() + '’이(가) 들어간 영상 ' + shown + '개';
    empty.hidden = !!shown;
  }

  // 주소의 #<섹션 id> 또는 #<보기 이름>이 지금 보는 곳이에요. 뒤로 가기와 링크 공유가 그대로 돼요.
  function apply(){
    var h = decodeURIComponent(location.hash.slice(1)), el = h && document.getElementById(h), v = null, s = null;
    if (views[h]) v = h;
    else if (el && el.matches('section[data-sec]')) {
      Object.keys(views).forEach(function(k){ if (views[k].contains(el)) v = k; });
      s = el;
    }
    if (!v) {
      v = views[read('home-view')] ? read('home-view') : 'cat';
      var saved = read('home-sel-' + v), se = saved && document.getElementById(saved);
      s = saved === '' ? null : (se && views[v].contains(se) ? se : (META[v].first ? kids(views[v])[0] : null));
    }
    if (v !== current || !tree.firstChild) {
      current = v;
      document.querySelectorAll('.seg button').forEach(function(b){ b.setAttribute('aria-pressed', b.dataset.view === v); });
      Object.keys(views).forEach(function(k){ views[k].hidden = k !== v; });
      orderBtn.hidden = v !== 'time';
      store('home-view', v);
      buildTree();
    }
    sel = s;
    store('home-sel-' + v, s ? s.id : '');
    filter();
  }
  function go(hash){ if (location.hash === hash) apply(); else location.hash = hash; }

  // 시간별 보기는 최신순으로 그려 두고, 오래된순이면 날짜 묶음과 그 안의 카드를 뒤집어요.
  function setOrder(newest){
    if (newest !== newestFirst) {
      var root = views.time;
      Array.prototype.slice.call(root.children).reverse().forEach(function(sec){ root.appendChild(sec); });
      root.querySelectorAll('.grid').forEach(function(g){
        Array.prototype.slice.call(g.children).reverse().forEach(function(c){ g.appendChild(c); });
      });
      newestFirst = newest;
      if (current === 'time') buildTree(), render();
    }
    orderBtn.textContent = newest ? '최신순 ↓' : '오래된순 ↑';
    orderBtn.setAttribute('aria-label', newest ? '최신순으로 보는 중, 눌러서 오래된순으로' : '오래된순으로 보는 중, 눌러서 최신순으로');
    store('home-order', newest ? 'new' : 'old');
  }

  document.querySelectorAll('.seg button').forEach(function(b){
    b.addEventListener('click', function(){
      var v = b.dataset.view, saved = read('home-sel-' + v), se = saved && document.getElementById(saved);
      go('#' + (se ? saved : (saved === '' || !META[v].first ? v : kids(views[v])[0].id)));
    });
  });
  tree.addEventListener('click', function(e){
    if (e.target.closest('a')) { tree.classList.remove('open'); treeBtn.setAttribute('aria-expanded', 'false'); }
  });
  treeBtn.addEventListener('click', function(){
    var open = tree.classList.toggle('open'); treeBtn.setAttribute('aria-expanded', open);
  });
  window.addEventListener('hashchange', function(){ apply(); window.scrollTo(0, 0); });
  orderBtn.addEventListener('click', function(){ setOrder(!newestFirst); });
  q.addEventListener('input', filter);
  document.getElementById('clear').addEventListener('click', function(){ q.value = ''; filter(); q.focus(); });
  document.addEventListener('keydown', function(e){
    if (e.key === '/' && document.activeElement !== q && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { e.preventDefault(); q.focus(); }
  });
  setOrder(read('home-order') !== 'old');
  apply();
})();
</script>
</body>
</html>
